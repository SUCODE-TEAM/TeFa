<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TEFA Smart Hydroponic System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --green-dark: #0D2818;
            --green-mid: #123522;
            --green-leaf: #1B4332;
            --green-mint: #A3C1B2;
            --green-tint: #EBF0ED;
            --text-dark: #1E293B;
            --text-muted: #94A3B8;
            --border-input: #E2E8F0;
            --bg-input: #F8FAFC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden !important;
            position: fixed;
            inset: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #EEF2F0;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle atmospheric ambient glow from revamp */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 12%, rgba(216, 226, 220, 0.65) 0%, transparent 45%),
                radial-gradient(circle at 90% 88%, rgba(216, 226, 220, 0.65) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        /* Revamp Botanical Spiral / Concentric Waves Background */
        .bg-deco {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .bg-deco-tr {
            top: -20px;
            right: -20px;
            width: 440px;
            max-width: 36vw;
            height: auto;
        }

        .bg-deco-bl {
            bottom: -20px;
            left: -20px;
            width: 440px;
            max-width: 36vw;
            height: auto;
        }

        /* Main Center Layout Stage */
        .login-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            box-sizing: border-box;
            padding: 12px 16px 20px;
        }

        /* Exact Initial "Login" Serif Vector Title */
        .title-wrapper {
            margin-bottom: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-svg {
            width: 216px;
            height: 84px;
            display: block;
        }

        /* Card Anchor - Exact Initial 412px Width */
        .card-anchor {
            position: relative;
            width: 412px;
            max-width: 100%;
        }

                        /* Sprout Badge on Top Border - Static, perfectly rooted */
        /* 3-Loop Leaves Doodle on Top-Left - Exact Figma Coordinates & Rotation */
        .loops-img {
            position: absolute;
            top: -88px;
            left: -77.6px;
            width: 115px;
            height: 115px;
            transform-origin: 0 0;
            transform: rotate(11.2184deg);
            pointer-events: none;
            z-index: 15;
            user-select: none;
        }

        .sprout-img {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            width: 78px;
            height: auto;
            pointer-events: none;
            z-index: 20;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(46, 125, 50, 0.15));
        }

        

        /* Swirling Falling Tea Leaves - Static under card */
        .swirling-leaves-img {
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-38%);
            width: 480px;
            height: auto;
            pointer-events: none;
            z-index: -1;
            user-select: none;
            filter: drop-shadow(0 4px 12px rgba(27, 94, 32, 0.06));
        }

                        /* Exact Figma Login Card */
        .login-card {
            background: #FFFFFF;
            border: none;
            border-radius: 16px;
            width: 412px;
            max-width: 100%;
            height: auto;
            min-height: 386px;
            padding: 32px 34px 26px;
            box-shadow: 0 20px 50px -4px rgba(9, 24, 15, 0.18), 0 8px 22px -2px rgba(2, 2, 2, 0.10), 0 2px 8px rgba(2, 2, 2, 0.06);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0D2818;
            margin-bottom: 7px;
            letter-spacing: 0.1px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
        }

        .input-icon-right {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: opacity 0.15s ease;
            z-index: 2;
        }

        .input-icon-right:hover {
            opacity: 0.75;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 42px;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            background-color: #F8FAFC;
            color: #1E293B;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .with-right-icon .form-input {
            padding-right: 42px;
        }

        .form-input:focus {
            border-color: #1B4332;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.16);
        }

        .form-input::placeholder {
            color: #94A3B8;
        }

        /* Toast Notification (Floating badge for success/error) */
        .login-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #FFFFFF;
            color: #1F2937;
            padding: 12px 22px;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s ease;
        }

        .login-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .login-toast.success {
            border: 1px solid #86EFAC;
            color: #15803D;
            background: #F0FDF4;
        }

        .login-toast.error {
            border: 1px solid #FCA5A5;
            color: #B91C1C;
            background: #FEF2F2;
        }

        @keyframes cardShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Custom Figma Checkbox ("Ingat Saya") */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 22px;
            margin-top: 2px;
        }

        .custom-checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
        }

        .hidden-checkbox {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .custom-checkbox-box {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background-color: #FFFFFF;
            border: 1.5px solid #D1D5DB;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .hidden-checkbox:checked + .custom-checkbox-box {
            background-color: #1B4332;
            border-color: #1B4332;
        }

        .custom-checkbox-box svg {
            display: none;
        }

        .hidden-checkbox:checked + .custom-checkbox-box svg {
            display: block;
        }

        .checkbox-text {
            font-size: 14px;
            font-weight: 500;
            color: #1E293B;
        }

        /* Exact Figma Gradient Login Button */
        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #0D2818 0%, #123522 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(9, 24, 15, 0.24);
            transition: filter 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit:hover {
            filter: brightness(1.08);
            box-shadow: 0 12px 28px rgba(9, 24, 15, 0.32);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Viewer Login Secondary Option */
        .viewer-login-wrapper {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .viewer-divider-text {
            font-size: 12px;
            color: #94A3B8;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .viewer-divider-text::before,
        .viewer-divider-text::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }

        .viewer-divider-text::before {
            margin-right: 12px;
        }

        .viewer-divider-text::after {
            margin-left: 12px;
        }

        .btn-viewer {
            width: 100%;
            height: 44px;
            background: #FFFFFF;
            color: #123522;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(9, 24, 15, 0.10), 0 2px 6px rgba(2, 2, 2, 0.06);
            touch-action: manipulation;
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
            box-sizing: border-box;
        }

        .btn-viewer:hover {
            background: #EBF0ED;
            color: #0D2818;
            box-shadow: 0 10px 24px rgba(9, 24, 15, 0.16);
            transform: translateY(-1px);
        }

        .btn-viewer:active {
            transform: translateY(0);
        }

        /* Sprout Badge on Top Border - Exact Figma Contact */
        .sprout-img {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            width: 78px;
            height: auto;
            pointer-events: none;
            z-index: 20;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(46, 125, 50, 0.15));
        }

        

        /* Swirling Falling Tea Leaves - Static under card */
        .swirling-leaves-img {
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-38%);
            width: 480px;
            height: auto;
            pointer-events: none;
            z-index: -1;
            user-select: none;
            filter: drop-shadow(0 4px 12px rgba(13, 40, 24, 0.08));
        }

        .bottom-action-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: none;
            padding: 6px 16px;
            border-radius: 999px;
            box-shadow: 0 12px 32px rgba(9, 24, 15, 0.14), 0 3px 10px rgba(2, 2, 2, 0.07);
            font-size: 13px;
            white-space: nowrap;
        }

        .link-viewer {
            color: var(--green-mid);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 6px;
            touch-action: manipulation;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .link-viewer:hover {
            color: var(--green-dark);
            text-decoration: underline;
        }

        .bar-divider {
            width: 1px;
            height: 14px;
            background: #CBD5E1;
        }

        .demo-chip {
            font-size: 12px;
            color: #64748B;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: 4px;
            touch-action: manipulation;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .demo-chip:hover {
            color: var(--green-dark);
            background: var(--green-tint);
        }

        .demo-chip code {
            background: #F1F5F9;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            color: var(--green-dark);
        }

        /* Short screens (laptops with small viewport height e.g. < 720px) */
        @media (max-height: 720px) {
            .login-stage {
                padding: 8px 16px 56px;
            }
            .title-wrapper {
                margin-bottom: 40px;
            }
            .title-svg {
                width: 170px;
                height: 66px;
            }
            .login-card {
                padding: 24px 24px 20px;
                min-height: 340px;
            }
            .form-group {
                margin-bottom: 12px;
            }
            .sprout-img {
                width: 66px;
            }
            .swirling-leaves-img {
                top: 270px;
                width: 380px;
            }
            .bottom-action-bar {
                bottom: 6px;
                padding: 5px 12px;
            }
        }

        @media (max-height: 720px) and (min-width: 601px) {
            .loops-img {
                top: -88px;
                left: -77.6px;
                width: 115px;
                height: 115px;
                transform-origin: 0 0;
                transform: rotate(11.2184deg);
            }
        }

        /* Responsive Adjustments for Mobile & Compact Screens */
        @media (max-width: 600px) {
            .login-stage {
                padding: 12px 16px 64px;
            }
            .card-anchor {
                width: 100%;
                max-width: 350px;
            }
            .title-wrapper {
                margin-bottom: 46px;
            }
            .title-svg {
                width: 180px;
                height: 70px;
            }
            .login-card {
                width: 100%;
                height: auto;
                min-height: 360px;
                padding: 28px 20px 20px;
            }
            .loops-img {
                top: -36px;
                left: -16px;
                width: 56px;
                height: 56px;
            }
            .sprout-img {
                top: 2px;
                width: 68px;
            }
            .swirling-leaves-img {
                top: 290px;
                left: 50%;
                transform: translateX(-40%);
                width: 360px;
            }
            .login-toast {
                max-width: calc(100vw - 24px);
                padding: 10px 16px;
                font-size: 12.5px;
                border-radius: 16px;
                text-align: center;
            }
            .bottom-action-bar {
                bottom: 8px;
                padding: 6px 14px;
                font-size: 11px;
                gap: 4px;
                flex-direction: column;
                border-radius: 14px;
                max-width: 90vw;
            }
            .bar-divider {
                display: none;
            }
        }

        
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="loginToast" class="login-toast" role="status" aria-live="polite"></div>

    <!-- Main Section (Initial Box + Revamp Spiral Background) -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const rememberMeCheck = document.getElementById('rememberMeCheck');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const eyeIcon = document.getElementById('eyeIcon');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const toast = document.getElementById('loginToast');
            const card = document.getElementById('cardElement');
            const demoChip = document.getElementById('demoChip');
            const usernameBox = document.getElementById('usernameBox');
            const passwordBox = document.getElementById('passwordBox');

            // Restore remembered username
            const savedUser = localStorage.getItem('tefa_saved_username');
            if (savedUser) {
                usernameInput.value = savedUser;
                rememberMeCheck.checked = true;
                passwordInput.focus();
            }

            // Demo chip autofill
            if (demoChip) {
                demoChip.addEventListener('click', () => {
                    usernameInput.value = 'admin';
                    passwordInput.value = 'admin123';
                    showToast('Kredensial demo terisi otomatis. Klik tombol Login!', 'success');
                });
            }

            // Password visibility toggle
            let isVisible = false;
                    // Toggle Password Visibility (Eye with slash vs Open Eye)
        const eyeSlashIcon = `<path d="M1098.75 606C1098.75 606 1101.75 600 1107 600C1112.25 600 1115.25 606 1115.25 606C1115.25 606 1112.25 612 1107 612C1101.75 612 1098.75 606 1098.75 606Z" /><path d="M1109.25 606C1109.25 607.243 1108.24 608.25 1107 608.25C1105.76 608.25 1104.75 607.243 1104.75 606C1104.75 604.757 1105.76 603.75 1107 603.75C1108.24 603.75 1109.25 604.757 1109.25 606Z" /><line x1="1098" y1="599" x2="1116" y2="613" />`;
        const eyeOpenIcon = `<path d="M1098.75 606C1098.75 606 1101.75 600 1107 600C1112.25 600 1115.25 606 1115.25 606C1115.25 606 1112.25 612 1107 612C1101.75 612 1098.75 606 1098.75 606Z" /><path d="M1109.25 606C1109.25 607.243 1108.24 608.25 1107 608.25C1105.76 608.25 1104.75 607.243 1104.75 606C1104.75 604.757 1105.76 603.75 1107 603.75C1108.24 603.75 1109.25 604.757 1109.25 606Z" />`;

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? eyeOpenIcon : eyeSlashIcon;
        });

            let toastTimer = null;
            function showToast(message, type = 'error') {
                clearTimeout(toastTimer);
                toast.className = `login-toast ${type} show`;
                const icon = type === 'error'
                    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
                    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
                toast.innerHTML = `${icon}<span>${message}</span>`;

                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            }

            const viewerLoginBtn = document.getElementById('viewerLoginBtn');
            if (viewerLoginBtn) {
                viewerLoginBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.setItem('tefa_auth_user', JSON.stringify({
                        username: 'Pengunjung',
                        role: 'viewer',
                        loginTime: new Date().toISOString()
                    }));
                    showToast('Login berhasil! Mengalihkan ke Dashboard Viewer...', 'success');
                    setTimeout(() => {
                        window.location.href = 'indexViewer.html';
                    }, 400);
                });
            }

            // Form Submit Authentication
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showToast('Harap lengkapi Username dan Kata Sandi.');
                    if (!username) usernameInput.focus();
                    else passwordInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                btnText.textContent = 'Memverifikasi...';
                submitBtn.style.opacity = '0.85';

                setTimeout(() => {
                    const isValidAdmin = (
                        (username.toLowerCase() === 'admin' && password === 'admin123') ||
                        (username.toLowerCase() === 'admin@tefa.id' && password === 'admin123') ||
                        (username.toLowerCase() === 'tefa' && password === 'mappi32')
                    );

                    const isValidViewer = (
                        (username.toLowerCase() === 'viewer' && (password === 'viewer' || password === 'viewer123')) ||
                        (username.toLowerCase() === 'pengunjung' && (password === 'pengunjung' || password === '123456' || password === 'viewer'))
                    );

                    if (isValidAdmin) {
                        showToast('Login berhasil! Mengalihkan ke Dashboard Admin...', 'success');

                        if (rememberMeCheck.checked) {
                            localStorage.setItem('tefa_saved_username', username);
                        } else {
                            localStorage.removeItem('tefa_saved_username');
                        }

                        sessionStorage.setItem('tefa_auth_user', JSON.stringify({
                            username: username,
                            role: 'admin',
                            loginTime: new Date().toISOString()
                        }));

                        setTimeout(() => {
                            window.location.href = 'indexAdmin.html';
                        }, 600);
                    } else if (isValidViewer) {
                        showToast('Login berhasil! Mengalihkan ke Dashboard Viewer...', 'success');

                        if (rememberMeCheck.checked) {
                            localStorage.setItem('tefa_saved_username', username);
                        } else {
                            localStorage.removeItem('tefa_saved_username');
                        }

                        sessionStorage.setItem('tefa_auth_user', JSON.stringify({
                            username: username,
                            role: 'viewer',
                            loginTime: new Date().toISOString()
                        }));

                        setTimeout(() => {
                            window.location.href = 'indexViewer.html';
                        }, 600);
                    } else {
                        submitBtn.disabled = false;
                        btnText.textContent = 'Login';
                        submitBtn.style.opacity = '1';
                        showToast('Username atau Kata Sandi salah. Gunakan admin / admin123', 'error');

                        card.style.animation = 'none';
                        setTimeout(() => {
                            card.style.animation = 'cardShake 0.4s ease';
                        }, 10);
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 350);
            });

            
        });
    </script>
</body>
</html>
