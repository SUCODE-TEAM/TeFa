<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Circle Origin Expansion</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #1e2621;
            min-height: 100vh;
            padding: 20px 40px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 10px;
            background: #2b3a2e;
            border-radius: 40px;
        }

        .notif-btn, .gear {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #1B5E20;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }

        .setting-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            z-index: 2000;
            display: none;
        }

        .setting-modal-backdrop.open {
            display: block;
            animation: backdropFadeIn .32s ease forwards;
        }

        .setting-modal-backdrop.closing {
            display: block;
            animation: backdropFadeOut .32s ease forwards;
        }

        .setting-modal {
            position: absolute;
            width: 580px;
            max-width: calc(100vw - 32px);
            background: #FFFFFF;
            border-radius: 10px;
            border: 1px solid #A5D6A7;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .22);
            padding: 28px 32px 24px;
            transform-origin: calc(100% - 31px) 31px;
            display: flex;
            flex-direction: column;
        }

        .setting-modal-backdrop.open .setting-modal {
            animation: circleExpandSetting .42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .setting-modal-backdrop.closing .setting-modal {
            animation: settingShrinkToCircle .32s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .setting-modal-backdrop.open .setting-header,
        .setting-modal-backdrop.open .setting-body,
        .setting-modal-backdrop.open .setting-footer {
            animation: contentFadeIn .3s ease .12s forwards;
            opacity: 0;
        }

        @keyframes circleExpandSetting {
            0% {
                clip-path: circle(31px at calc(100% - 31px) 31px);
                border-radius: 50%;
                opacity: 0.9;
                transform: scale(0.15);
            }
            40% {
                border-radius: 20px;
                opacity: 1;
            }
            100% {
                clip-path: circle(150% at calc(100% - 31px) 31px);
                border-radius: 10px;
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes settingShrinkToCircle {
            0% {
                clip-path: circle(150% at calc(100% - 31px) 31px);
                border-radius: 10px;
                opacity: 1;
                transform: scale(1);
            }
            60% {
                border-radius: 24px;
                opacity: 0.95;
            }
            100% {
                clip-path: circle(31px at calc(100% - 31px) 31px);
                border-radius: 50%;
                opacity: 0;
                transform: scale(0.15);
            }
        }

        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes backdropFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .setting-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .setting-header h2 { font-size: 28px; font-weight: 800; color: #1B5E20; margin: 0; }
        .setting-btn-close { width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-row">
        <div class="notif-btn" id="notifBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A5D6A7" stroke-width="2.3">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </div>
        <div class="gear" id="gearBtn">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A5D6A7" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
    </div>

    <!-- Backdrop -->
    <div class="setting-modal-backdrop" id="settingModalBackdrop">
        <div class="setting-modal" id="settingModal">
            <div class="setting-header">
                <h2>Setting</h2>
                <button class="setting-btn-close" id="settingBtnClose" type="button">✕</button>
            </div>
            <div class="setting-body" style="height: 200px; display:flex; align-items:center; justify-content:center; color:#2E7D32;">
                Setting options go here...
            </div>
        </div>
    </div>

    <script>
        var gear = document.getElementById('gearBtn');
        var backdrop = document.getElementById('settingModalBackdrop');
        var modal = document.getElementById('settingModal');
        var close = document.getElementById('settingBtnClose');

        function openModal() {
            var rect = gear.getBoundingClientRect();
            modal.style.top = rect.top + 'px';
            modal.style.right = (window.innerWidth - rect.right) + 'px';
            backdrop.classList.remove('closing');
            backdrop.classList.add('open');
        }

        function closeModal() {
            backdrop.classList.add('closing');
            setTimeout(function() {
                backdrop.classList.remove('open');
                backdrop.classList.remove('closing');
            }, 320);
        }

        gear.addEventListener('click', openModal);
        close.addEventListener('click', closeModal);
        backdrop.addEventListener('click', function(e) {
            if (e.target === backdrop) closeModal();
        });

        // Trigger open for test
        setTimeout(openModal, 200);
    </script>
</body>
</html>
